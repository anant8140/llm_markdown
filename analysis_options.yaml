include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    # its own package, analyzed on its own (see .github/workflows/ci.yml)
    - packages/**
    # has its own dependencies; run as described in benchmark/README.md
    - benchmark/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
