name: llm_markdown_firebase_ai
description: >-
  Streams Firebase AI Logic (firebase_ai) Gemini replies into llm_markdown, with thinking, function calls and Google Search sources.
version: 0.2.0
repository: https://github.com/anant8140/llm_markdown/tree/main/packages/llm_markdown_firebase_ai
issue_tracker: https://github.com/anant8140/llm_markdown/issues
screenshots:
  - description: A Gemini reply with thinking, a Google Search call and its sources
    path: doc/firebase_ai.gif
  - description: The finished reply
    path: doc/firebase_ai.png
topics:
  - markdown
  - ai
  - firebase
  - gemini
  - llm

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  firebase_ai: ">=3.15.0 <6.0.0"
  flutter:
    sdk: flutter
  llm_markdown: ">=0.6.0 <0.8.0"

dev_dependencies:
  flutter_ai_toolkit: ^1.2.0
  flutter_lints: ^6.0.0
  material_ui: ^1.11.1
  flutter_test:
    sdk: flutter
