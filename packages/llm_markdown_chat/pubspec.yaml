name: llm_markdown_chat
description: >-
  A ready AI chat screen for Flutter on llm_markdown: streaming Markdown replies, input with send and stop, retry and copy, for any model.
version: 0.2.0
repository: https://github.com/anant8140/llm_markdown/tree/main/packages/llm_markdown_chat
issue_tracker: https://github.com/anant8140/llm_markdown/issues
screenshots:
  - description: A reply streaming into the chat, with a code block and a table
    path: doc/chat.gif
  - description: An empty chat with suggestions
    path: doc/empty.png
  - description: A finished reply with copy and try again
    path: doc/chat.png
topics:
  - chat
  - ai
  - llm
  - markdown
  - streaming

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  llm_markdown: ^0.6.1
  server_sent_events: ^0.2.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
