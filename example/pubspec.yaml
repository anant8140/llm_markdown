name: llm_markdown_example
description: A chat demo that streams a reply into llm_markdown.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_math_fork: ^0.7.4
  llm_client:
    path: ../packages/llm_client
  llm_markdown:
    path: ../
  material_ui: ^1.11.1
  server_sent_events:
    path: ../packages/server_sent_events

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# until the parser is on pub.dev, and to try changes to both together
dependency_overrides:
  llm_markdown_parser:
    path: ../packages/llm_markdown_parser
  partial_json:
    path: ../packages/partial_json
  server_sent_events:
    path: ../packages/server_sent_events

flutter:
  uses-material-design: true
