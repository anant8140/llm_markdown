name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  latest:
    name: Flutter 3.50
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze

  minimum:
    name: Flutter 3.35 (minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.0
          channel: stable
          cache: true
      # material_ui needs Flutter 3.47+, it is only used by one test file
      - run: |
          sed -i '/material_ui/d' pubspec.yaml
          rm test/design_library_test.dart
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test
