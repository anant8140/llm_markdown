name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  latest:
    name: Flutter 3.50
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      # pictures differ between systems; the golden job checks them
      - run: flutter test --exclude-tags golden
      - name: Parser package (pure Dart)
        working-directory: packages/llm_markdown_parser
        run: dart test
      - name: Example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test

  golden:
    name: Golden images (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --tags golden

  minimum:
    name: Flutter 3.35 (minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.0
          channel: stable
          cache: true
      # material_ui needs Flutter 3.47+, it is only used by one test file;
      # the example targets the latest Flutter only
      - run: |
          sed -i '/material_ui/d' pubspec.yaml
          rm test/design_library_test.dart
          rm -r example
      - run: flutter pub get
      - run: flutter analyze lib test
      # the pictures in test/goldens are made with the newer Flutter
      - run: flutter test --exclude-tags golden
      - name: Parser package (pure Dart)
        working-directory: packages/llm_markdown_parser
        run: dart test
