name: llm_markdown
description: >-
  Markdown widget for streaming LLM chat replies. Parses only new text, closes
  half-typed syntax, highlights code and follows the scroll.
version: 0.4.1
repository: https://github.com/anant8140/llm_markdown
issue_tracker: https://github.com/anant8140/llm_markdown/issues
screenshots:
  - description: A reply streaming in, with a code block, a drawn diagram, math and a table
    path: doc/demo.gif
topics:
  - markdown
  - ai
  - chat
  - streaming
  - llm

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  characters: ^1.4.0
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.4
  http: ^1.1.0
  llm_markdown_parser: ^0.1.0
  markdown: ^7.3.1
  meta: ^1.15.0
  re_highlight: ^0.0.3
  vector_graphics_compiler: ^1.1.14

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  material_ui: ^1.11.1

flutter:
  # the code font; fonts/OFL.txt is its license
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
