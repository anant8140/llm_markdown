name: llm_markdown
description: >-
  Markdown widget for streaming LLM chat replies. Parses only new text, closes
  half-typed syntax, highlights code and follows the scroll.
version: 0.2.0
repository: https://github.com/anant8140/llm_markdown
issue_tracker: https://github.com/anant8140/llm_markdown/issues
screenshots:
  - description: A reply streaming into the widget
    path: doc/demo.gif
topics:
  - markdown
  - ai
  - chat
  - streaming
  - llm

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  characters: ^1.4.0
  flutter:
    sdk: flutter
  markdown: ^7.3.1
  meta: ^1.15.0
  re_highlight: ^0.0.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  material_ui: ^1.11.1
